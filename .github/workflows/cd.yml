name: map.zig.bd

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '!app/data/**'
      - 'source/**'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/cd.yml'

  schedule:
    - cron: '0 6 * * 1'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.2248+3f6a02acd
          use-tool-cache: true

      - name: Fetch location sources
        run: zig build source -- all

      - name: Upload location data
        uses: actions/upload-artifact@v4
        with:
          name: location-data
          path: app/data/
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    needs: source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download location data
        uses: actions/download-artifact@v4
        with:
          name: location-data
          path: app/data

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.2248+3f6a02acd
          use-tool-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Site
        run: zig build zx -- export --build-args=--release=fast

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
